<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ionut - Lord of Code</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=MedievalSharp&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cinzel', serif;
      background: #0a0a0a;
      color: #e8dcc4;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    /* Background Layers */
    .background-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .stone-texture {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(rgba(10, 10, 10, 0.85), rgba(10, 10, 10, 0.85)),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
      background-size: 100% 100%, 100px 100px, 100px 100px;
    }

    .snow-container, .fire-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Realistic Snow */
    .snowflake {
      position: absolute;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.8) 40%, rgba(255, 255, 255, 0) 100%);
      border-radius: 50%;
      pointer-events: none;
      animation: snowfall linear infinite;
      filter: blur(1px);
    }

    @keyframes snowfall {
      0% {
        transform: translateY(-10px) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) translateX(var(--drift)) rotate(360deg);
        opacity: 0;
      }
    }

    .torch {
      position: absolute;
      width: 4px;
      height: 60px;
      background: linear-gradient(to top, #4a2c1c, #2a1810);
    }

    .torch-left {
      top: 20%;
      left: 5%;
    }

    .torch-right {
      top: 20%;
      right: 5%;
    }

    .flame {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 40px;
      background: radial-gradient(ellipse at center, #ff6b00 0%, #ff8800 20%, #ff4400 40%, rgba(255, 68, 0, 0) 70%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      animation: flicker 0.3s infinite alternate, sway 2s ease-in-out infinite;
      filter: blur(2px);
    }

    .flame::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 25px;
      background: radial-gradient(ellipse at center, #ffdd00 0%, #ff8800 40%, rgba(255, 136, 0, 0) 70%);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      filter: blur(1px);
    }

    .flame-glow {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(255, 100, 0, 0.3) 0%, transparent 70%);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes flicker {
      0%, 100% { transform: translateX(-50%) scaleY(1); }
      50% { transform: translateX(-50%) scaleY(0.95); }
    }

    @keyframes sway {
      0%, 100% { transform: translateX(-50%) rotate(-2deg); }
      50% { transform: translateX(-50%) rotate(2deg); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.8; transform: translateX(-50%) scale(1.1); }
    }

    /* Content Wrapper - Add padding for floating elements */
    .content-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 250px 60px 250px;
      min-height: 100vh;
    }

    /* Shield/Avatar */
    .shield-container {
      position: relative;
      width: 220px;
      height: 260px;
      margin-bottom: 30px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.8));
    }

    .shield {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4a4a4a 0%, #2a2a2a 50%, #1a1a1a 100%);
      clip-path: polygon(50% 0%, 100% 20%, 100% 70%, 50% 100%, 0% 70%, 0% 20%);
      border: 3px solid #8b7355;
      box-shadow: 
        inset 0 0 30px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(139, 115, 85, 0.3);
    }

    .shield::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
      clip-path: polygon(50% 0%, 100% 20%, 100% 70%, 50% 100%, 0% 70%, 0% 20%);
    }

    .avatar-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #8b7355;
      box-shadow: 0 0 20px rgba(255, 100, 0, 0.5);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-rune {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, #666, #444);
      border-radius: 50%;
      border: 3px solid #8b7355;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      transition: all 0.5s ease;
      box-shadow: 0 0 20px rgba(100, 100, 100, 0.5);
    }

    .status-rune.online {
      background: radial-gradient(circle, #00ff00, #00cc00);
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
      animation: runeGlowGreen 2s ease-in-out infinite;
    }

    .status-rune.offline {
      background: radial-gradient(circle, #ff0000, #cc0000);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
      animation: runeGlowRed 2s ease-in-out infinite;
    }

    @keyframes runeGlowGreen {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
      50% { box-shadow: 0 0 40px rgba(0, 255, 0, 1); }
    }

    @keyframes runeGlowRed {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }
      50% { box-shadow: 0 0 40px rgba(255, 0, 0, 1); }
    }

    /* Title */
    .title-container {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    .main-title {
      font-size: 64px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 25%, #ff8c00 50%, #ff6b00 75%, #ffd700 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      letter-spacing: 4px;
      margin-bottom: 10px;
      font-family: 'Cinzel', serif;
      animation: gradientShift 4s ease-in-out infinite;
      filter: drop-shadow(2px 2px 0px #000) drop-shadow(4px 4px 10px rgba(255, 100, 0, 0.5));
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      font-size: 18px;
      color: #c4a574;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 400;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      margin-bottom: 25px;
    }

    /* Typing Effect Box */
    .typing-box {
      margin-top: 25px;
      padding: 20px 30px;
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.8), rgba(20, 15, 10, 0.8));
      border: 2px solid #8b7355;
      border-radius: 8px;
      box-shadow: 
        0 5px 15px rgba(0, 0, 0, 0.5),
        inset 0 0 20px rgba(0, 0, 0, 0.3);
      min-height: 70px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .typing-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 100, 0, 0.05), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    .typing-text {
      font-size: 15px;
      color: #e8dcc4;
      text-align: center;
      letter-spacing: 1px;
      font-style: italic;
      position: relative;
      z-index: 1;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      word-wrap: break-word;
      max-width: 100%;
    }

    .typing-text::after {
      content: '|';
      animation: blink 1s infinite;
      margin-left: 3px;
      color: #ff8800;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .ornament {
      width: 200px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #8b7355, transparent);
      margin: 15px auto;
      position: relative;
    }

    .ornament::before,
    .ornament::after {
      content: '◆';
      position: absolute;
      top: -8px;
      color: #8b7355;
      font-size: 18px;
    }

    .ornament::before {
      left: -10px;
    }

    .ornament::after {
      right: -10px;
    }

    /* Weapons/Skills - Floating Left Side */
    .weapons-hall {
      position: fixed;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      width: 200px;
      height: 500px;
      z-index: 10;
    }

    .weapon-card {
      position: absolute;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.9), rgba(20, 15, 10, 0.9));
      border: 2px solid #8b7355;
      border-radius: 50%;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.4s ease;
      box-shadow: 
        0 5px 15px rgba(0, 0, 0, 0.5),
        inset 0 0 20px rgba(0, 0, 0, 0.3);
    }

    .weapon-card:nth-child(1) {
      top: 5%;
      left: 10%;
      animation: float 6s ease-in-out infinite;
    }

    .weapon-card:nth-child(2) {
      top: 15%;
      left: 60%;
      animation: float 7s ease-in-out infinite 0.5s;
    }

    .weapon-card:nth-child(3) {
      top: 30%;
      left: 20%;
      animation: float 5.5s ease-in-out infinite 1s;
    }

    .weapon-card:nth-child(4) {
      top: 40%;
      left: 70%;
      animation: float 6.5s ease-in-out infinite 1.5s;
    }

    .weapon-card:nth-child(5) {
      top: 55%;
      left: 15%;
      animation: float 7.5s ease-in-out infinite 2s;
    }

    .weapon-card:nth-child(6) {
      top: 65%;
      left: 65%;
      animation: float 6s ease-in-out infinite 2.5s;
    }

    .weapon-card:nth-child(7) {
      top: 80%;
      left: 25%;
      animation: float 5s ease-in-out infinite 3s;
    }

    .weapon-card:nth-child(8) {
      top: 90%;
      left: 55%;
      animation: float 6.8s ease-in-out infinite 3.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      25% {
        transform: translateY(-15px) rotate(5deg);
      }
      50% {
        transform: translateY(-8px) rotate(-3deg);
      }
      75% {
        transform: translateY(-12px) rotate(4deg);
      }
    }

    .weapon-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 100, 0, 0.1));
      opacity: 0;
      transition: opacity 0.4s ease;
      border-radius: 50%;
    }

    .weapon-card:hover {
      transform: scale(1.3) rotate(10deg);
      border-color: #ff8800;
      box-shadow: 
        0 10px 30px rgba(255, 100, 0, 0.6),
        inset 0 0 20px rgba(255, 100, 0, 0.2);
      z-index: 100;
    }

    .weapon-card:hover::before {
      opacity: 1;
    }

    .weapon-icon {
      font-size: 24px;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
      transition: all 0.4s ease;
    }

    .weapon-card:hover .weapon-icon {
      transform: scale(1.1);
      filter: drop-shadow(0 0 10px rgba(255, 136, 0, 0.8));
    }

    .weapon-name {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 600;
      color: #e8dcc4;
      text-align: center;
      letter-spacing: 0.5px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .weapon-card:hover .weapon-name {
      opacity: 1;
    }

    .weapon-level {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 10, 0.95);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .weapon-card.active .weapon-level {
      opacity: 1;
    }

    .level-percentage {
      font-size: 16px;
      font-weight: 700;
      color: #ff8800;
      text-shadow: 0 0 10px rgba(255, 136, 0, 0.8);
    }

    .level-text {
      font-size: 7px;
      color: #c4a574;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* Quote Banner */
    .quote-banner {
      max-width: 600px;
      text-align: center;
      padding: 30px 40px;
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.8), rgba(20, 15, 10, 0.8));
      border: 2px solid #8b7355;
      border-radius: 10px;
      margin: 40px auto 60px auto;
      position: relative;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }

    .quote-banner::before,
    .quote-banner::after {
      content: '❝';
      position: absolute;
      font-size: 50px;
      color: rgba(139, 115, 85, 0.3);
      font-family: Georgia, serif;
    }

    .quote-banner::before {
      top: 10px;
      left: 20px;
    }

    .quote-banner::after {
      content: '❞';
      bottom: 10px;
      right: 20px;
    }

    .quote-text {
      font-size: 18px;
      font-style: italic;
      color: #e8dcc4;
      line-height: 1.8;
      letter-spacing: 1px;
    }

    /* Social Links - Lower Position */
    .social-container {
      position: fixed;
      right: 30px;
      top: 60%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.9), rgba(20, 15, 10, 0.9));
      border: 2px solid #8b7355;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c4a574;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .social-icon:hover {
      transform: scale(1.15) rotate(5deg);
      border-color: #ff8800;
      color: #ff8800;
      box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
    }

    .social-icon::after {
      content: attr(data-platform);
      position: absolute;
      right: 60px;
      background: rgba(40, 30, 20, 0.95);
      color: #e8dcc4;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      border: 1px solid #8b7355;
      font-family: 'Cinzel', serif;
    }

    .social-icon:hover::after {
      opacity: 1;
    }

    /* Music Player - Bottom Right - Extra Compact */
    .music-player {
      position: fixed;
      right: 30px;
      bottom: 20px;
      width: 150px;
      background: linear-gradient(135deg, rgba(40, 30, 20, 0.95), rgba(20, 15, 10, 0.95));
      border: 2px solid #8b7355;
      border-radius: 10px;
      padding: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .player-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .play-button {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #ff8800, #ff6600);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(255, 100, 0, 0.4);
      flex-shrink: 0;
    }

    .play-button:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(255, 100, 0, 0.6);
    }

    .play-button:active {
      transform: scale(0.95);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 9px;
      color: #e8dcc4;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 8px;
      color: #c4a574;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audio-waves {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      height: 16px;
      margin-bottom: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      padding: 3px;
    }

    .wave-bar {
      width: 2px;
      background: linear-gradient(to top, #ff6600, #ff8800);
      border-radius: 2px;
      animation: wave 0.8s ease-in-out infinite alternate;
      opacity: 0;
    }

    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .wave-bar:nth-child(5) { animation-delay: 0.4s; }
    .wave-bar:nth-child(6) { animation-delay: 0.5s; }
    .wave-bar:nth-child(7) { animation-delay: 0.6s; }

    .music-player.playing .wave-bar {
      opacity: 1;
    }

    @keyframes wave {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .volume-icon {
      color: #c4a574;
      font-size: 9px;
      flex-shrink: 0;
    }

    .volume-slider {
      flex: 1;
      height: 3px;
      background: rgba(139, 115, 85, 0.3);
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
      max-width: 70px;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      background: linear-gradient(135deg, #ff8800, #ff6600);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(255, 136, 0, 0.5);
      transition: all 0.2s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 8px rgba(255, 136, 0, 0.8);
    }

    .volume-slider::-moz-range-thumb {
      width: 9px;
      height: 9px;
      background: linear-gradient(135deg, #ff8800, #ff6600);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 5px rgba(255, 136, 0, 0.5);
    }

    .volume-percentage {
      font-size: 8px;
      color: #c4a574;
      min-width: 20px;
      text-align: right;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-title {
        font-size: 42px;
      }
      
      .subtitle {
        font-size: 14px;
      }
      
      .weapons-hall {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
        height: auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin: 30px 0;
      }

      .weapon-card {
        position: relative !important;
        animation: none !important;
      }

      .weapon-card:nth-child(1),
      .weapon-card:nth-child(2),
      .weapon-card:nth-child(3),
      .weapon-card:nth-child(4),
      .weapon-card:nth-child(5),
      .weapon-card:nth-child(6),
      .weapon-card:nth-child(7),
      .weapon-card:nth-child(8) {
        top: auto;
        left: auto;
      }
      
      .torch-left,
      .torch-right {
        display: none;
      }
      
      .quote-banner {
        padding: 20px;
      }
      
      .quote-text {
        font-size: 14px;
      }

      .social-container {
        position: relative;
        right: auto;
        top: auto;
        transform: none;
        flex-direction: row;
        justify-content: center;
        margin-top: 30px;
      }

      .social-icon::after {
        right: auto;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
      }

      .music-player {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="background-container">
    <div class="stone-texture"></div>
    <div class="snow-container" id="snow-container"></div>
    <div class="fire-container">
      <div class="torch torch-left">
        <div class="flame-glow"></div>
        <div class="flame"></div>
      </div>
      <div class="torch torch-right">
        <div class="flame-glow"></div>
        <div class="flame"></div>
      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="shield-container">
      <div class="shield"></div>
      <div class="avatar-frame">
        <img src="https://i.imgur.com/MCXJWcg.png" alt="Ionut">
      </div>
      <div class="status-rune" id="status-rune">
        <i class="fas fa-circle"></i>
      </div>
    </div>

    <div class="title-container">
      <h1 class="main-title">Ionut</h1>
      <div class="ornament"></div>
      <p class="subtitle">Lord of Code • Master of Digital Realms</p>
      
      <div class="typing-box">
        <div class="typing-text" id="typing-text"></div>
      </div>
    </div>

  <div class="weapons-hall">
    <div class="weapon-card" data-level="92" onclick="toggleSkillLevel(this)">
      <i class="devicon-html5-plain weapon-icon" style="color: #E34F26;"></i>
      <div class="weapon-name">HTML5</div>
      <div class="weapon-level">
        <div class="level-percentage">92%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="88" onclick="toggleSkillLevel(this)">
      <i class="devicon-css3-plain weapon-icon" style="color: #1572B6;"></i>
      <div class="weapon-name">CSS3</div>
      <div class="weapon-level">
        <div class="level-percentage">88%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="95" onclick="toggleSkillLevel(this)">
      <i class="devicon-javascript-plain weapon-icon" style="color: #F7DF1E;"></i>
      <div class="weapon-name">JavaScript</div>
      <div class="weapon-level">
        <div class="level-percentage">95%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="80" onclick="toggleSkillLevel(this)">
      <i class="devicon-php-plain weapon-icon" style="color: #777BB4;"></i>
      <div class="weapon-name">PHP</div>
      <div class="weapon-level">
        <div class="level-percentage">80%</div>
        <div class="level-text">MASTERY</div>
      </div>

    <div class="weapon-card" data-level="75" onclick="toggleSkillLevel(this)">
      <i class="devicon-python-plain weapon-icon" style="color: #3776AB;"></i>
      <div class="weapon-name">Python</div>
      <div class="weapon-level">
        <div class="level-percentage">75%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="85" onclick="toggleSkillLevel(this)">
      <i class="devicon-react-original weapon-icon" style="color: #61DAFB;"></i>
      <div class="weapon-name">React</div>
      <div class="weapon-level">
        <div class="level-percentage">85%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="78" onclick="toggleSkillLevel(this)">
      <i class="devicon-nodejs-plain weapon-icon" style="color: #339933;"></i>
      <div class="weapon-name">Node.js</div>
      <div class="weapon-level">
        <div class="level-percentage">78%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>

    <div class="weapon-card" data-level="82" onclick="toggleSkillLevel(this)">
      <i class="devicon-git-plain weapon-icon" style="color: #F05032;"></i>
      <div class="weapon-name">Git</div>
      <div class="weapon-level">
        <div class="level-percentage">82%</div>
        <div class="level-text">MASTERY</div>
      </div>
    </div>
  </div>

  <div class="music-player" id="music-player">
    <div class="player-header">
      <button class="play-button" id="play-button">
        <i class="fas fa-play" id="play-icon"></i>
      </button>
      <div class="track-info">
        <div class="track-name">The Real Slim Shady</div>
        <div class="track-artist">Eminem</div>
      </div>
    </div>

    <div class="volume-control">
      <i class="fas fa-volume-up volume-icon"></i>
      <input type="range" min="0" max="100" value="70" class="volume-slider" id="volume-slider">
      <span class="volume-percentage" id="volume-percentage">70%</span>
    </div>
    
    <audio id="audio-player" loop>
      <source src="/eminem.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="social-container">
    <a href="#" class="social-icon" data-platform="Instagram">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="#" class="social-icon" data-platform="Facebook">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a href="#" class="social-icon" data-platform="GitHub">
      <i class="fab fa-github"></i>
    </a>
    <a href="#" class="social-icon" data-platform="LinkedIn">
      <i class="fab fa-linkedin-in"></i>
    </a>
    <a href="#" class="social-icon" data-platform="Twitter">
      <i class="fab fa-twitter"></i>
    </a>
  </div>

  <script>
    function createRealisticSnow() {
      const container = document.getElementById('snow-container');
      const snowflakeCount = 60;
      
      for (let i = 0; i < snowflakeCount; i++) {
        const snowflake = document.createElement('div');
        snowflake.classList.add('snowflake');
        
        const size = Math.random() * 4 + 2;
        snowflake.style.width = size + 'px';
        snowflake.style.height = size + 'px';
        
        snowflake.style.left = Math.random() * 100 + '%';
        
        const duration = Math.random() * 10 + 8;
        snowflake.style.animationDuration = duration + 's';
        
        snowflake.style.animationDelay = Math.random() * 5 + 's';
        
        const drift = (Math.random() - 0.5) * 100;
        snowflake.style.setProperty('--drift', drift + 'px');
        
        snowflake.style.opacity = (size / 6) * 0.8 + 0.2;
        
        container.appendChild(snowflake);
      }
    }

    const typingElement = document.getElementById('typing-text');
    const typingPhrases = [
      "A Developer Always Debugs His Code",
      "Winter is Coming... But Code is Forever",
      "When You Play the Game of Code, You Win or You Learn",
      "The Night is Dark and Full of Errors",
      "I Drink Coffee and I Know Things",
      "What is Dead May Never Die, But Rises Harder and Stronger"
    ];
    
    let typingPhraseIndex = 0;
    let typingCharIndex = 0;
    let isTypingDeleting = false;
    let typingDelay = 100;
    
    function typeEffect() {
      const currentPhrase = typingPhrases[typingPhraseIndex];
      
      if (isTypingDeleting) {
        typingElement.textContent = currentPhrase.substring(0, typingCharIndex - 1);
        typingCharIndex--;
        typingDelay = 50;
      } else {
        typingElement.textContent = currentPhrase.substring(0, typingCharIndex + 1);
        typingCharIndex++;
        typingDelay = 100;
      }
      
      if (!isTypingDeleting && typingCharIndex === currentPhrase.length) {
        isTypingDeleting = true;
        typingDelay = 2000;
      } else if (isTypingDeleting && typingCharIndex === 0) {
        isTypingDeleting = false;
        typingPhraseIndex = (typingPhraseIndex + 1) % typingPhrases.length;
        typingDelay = 500;
      }
      
      setTimeout(typeEffect, typingDelay);
    }

    const quotes = [
      "Valar Morghulis - All Bugs Must Die",
      "In Code We Trust, In Testing We Must",
      "A Coder Never Forgets His First Hello World",
      "Fire and Blood... But Mostly Coffee",
      "The Code Must Flow"
    ];

    let quoteIndex = 0;
    function rotateQuote() {
      const quoteElement = document.getElementById('quote-text');
      quoteElement.style.opacity = '0';
      
      setTimeout(() => {
        quoteIndex = (quoteIndex + 1) % quotes.length;
        quoteElement.textContent = quotes[quoteIndex];
        quoteElement.style.opacity = '1';
      }, 500);
    }

    const audioPlayer = document.getElementById('audio-player');
    const playButton = document.getElementById('play-button');
    const playIcon = document.getElementById('play-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const volumePercentage = document.getElementById('volume-percentage');
    const musicPlayerEl = document.getElementById('music-player');

    audioPlayer.volume = 0.7;

    playButton.addEventListener('click', () => {
      if (audioPlayer.paused) {
        audioPlayer.play()
          .then(() => {
            playIcon.className = 'fas fa-pause';
            musicPlayerEl.classList.add('playing');
          })
          .catch(error => {
            console.error('Audio play failed:', error);
          });
      } else {
        audioPlayer.pause();
        playIcon.className = 'fas fa-play';
        musicPlayerEl.classList.remove('playing');
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      const volume = e.target.value;
      audioPlayer.volume = volume / 100;
      volumePercentage.textContent = volume + '%';
    });

    function toggleSkillLevel(card) {
      document.querySelectorAll('.weapon-card').forEach(c => {
        if (c !== card) {
          c.classList.remove('active');
        }
      });
      
      card.classList.toggle('active');
      
      if (card.classList.contains('active')) {
        setTimeout(() => {
          card.classList.remove('active');
        }, 3000);
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch('https://oceanbot.net/online.php?id=1481979077');
        const data = await response.json();
        const statusRune = document.getElementById('status-rune');
        
        if (data && data.status === 'online') {
          statusRune.classList.remove('offline');
          statusRune.classList.add('online');
          statusRune.innerHTML = '<i class="fas fa-fire"></i>';
        } else {
          statusRune.classList.remove('online');
          statusRune.classList.add('offline');
          statusRune.innerHTML = '<i class="fas fa-fire"></i>';
        }
      } catch (error) {
        console.error('Status check failed:', error);
        const statusRune = document.getElementById('status-rune');
        statusRune.classList.remove('online');
        statusRune.classList.add('offline');
        statusRune.innerHTML = '<i class="fas fa-fire"></i>';
      }
    }

    window.addEventListener('load', () => {
      createRealisticSnow();
      checkStatus();
      
      setInterval(checkStatus, 30000);
      
      setTimeout(typeEffect, 1000);
      
      setInterval(rotateQuote, 8000);
      
      const quoteElement = document.getElementById('quote-text');
      quoteElement.style.transition = 'opacity 0.5s ease';
    });

    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
        }
      });
    }, observerOptions);

    document.querySelectorAll('.weapon-card').forEach((card, index) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(30px)';
      card.style.transition = `all 0.6s ease ${index * 0.1}s`;
      observer.observe(card);
    });
  </script>
</body>
